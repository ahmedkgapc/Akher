<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>آخر الدنيا</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a2123;--panel:#232c2f;--line:#37444a;--tx:#ebe7da;--mut:#93a0a3;--hz:#d4a72c;--red:#c4513f;--grn:#7fae6a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.9 Tajawal,system-ui,sans-serif;padding:14px 14px 90px;max-width:560px;margin-inline:auto}
h1,h2,h3{font-family:'Reem Kufi',Tajawal,sans-serif;margin:.3em 0}
h1{font-size:2.4rem;color:var(--hz);letter-spacing:0}
.tape{height:10px;background:repeating-linear-gradient(-45deg,var(--hz) 0 14px,#1a2123 14px 28px);margin:6px 0 16px;border-radius:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--hz);outline-offset:2px}
.pri{background:var(--hz);color:#1a2123;border:0;font-weight:700;width:100%;padding:13px}
.ch{display:block;width:100%;text-align:right;margin:8px 0;padding:13px 14px;line-height:1.7}
.ch.sel{border-color:var(--hz);background:#2e3a3d}
input,select,textarea{background:#151b1d;border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:.9rem;text-align:center}
.res div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 2px}
.res b{display:block;font-size:1.1rem}
.low{border-color:var(--red)!important;color:#f0a090}
.pl{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pl div{min-width:104px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.88rem;line-height:1.5}
.bar{height:5px;background:#101617;border-radius:3px;margin-top:3px}
.bar i{display:block;height:100%;background:var(--grn);border-radius:3px}
.dead{opacity:.45}
.story{white-space:pre-wrap;font-size:1.08rem;line-height:2.05}
.mut{color:var(--mut);font-size:.9rem}
.err{color:#f0a090}
.bottom{position:fixed;inset:auto 0 0 0;background:#141a1c;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;max-width:560px;margin:auto}
.bottom button{flex:1;padding:9px 4px;font-size:.92rem}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal>div{background:var(--bg);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;border:1px solid var(--line)}
.tm{height:6px;background:var(--red);border-radius:3px;transition:width 1s linear}
.sk{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
.sk button{padding:2px 12px;flex:0}
.novel{font-size:1.1rem;line-height:2.2;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>

<script>
const SK=['قوة','سرعة','تحمل','تخفي','علاج','صيد'];
const ROLES={'مقاتل':'قوة','مستكشف':'سرعة','مهندس':'تحمل','طبيب':'علاج','صياد':'صيد'};
const SCEN={'عشوائي':'','زومبي':'جائحة زومبي','فيروس غريب':'فيروس بيحول الناس لحاجة مش بشرية','غزو فضائي':'غزو كائنات فضائية','ظلام دائم':'ظلام دائم غطى الأرض وكائنات بتطلع فيه','الطبيعة بتهاجم':'الحيوانات والنباتات بقت عدوانية وبتهاجم الإنسان'};
const RES={food:'🍞 أكل',water:'💧 مية',meds:'💊 دوا',fuel:'⛽ وقود',ammo:'🔫 ذخيرة',morale:'🙂 معنويات',trust:'🤝 ثقة'};
const PLACES=['مترو أنفاق','مول مهجور','مستشفى','سجن','مزرعة','سفينة','محطة إذاعة','مدرسة','مصنع','برج مراقبة'];
const EVENTS=['عاصفة','كمين','صوت راديو غامض','طفل لوحده','قافلة تجار','ناجي مصاب','وحش ضخم (زعيم)','مخزن مغلق','ملجأ اتغزى','جماعة غريبة','قرار أخلاقي صعب','قوة خارقة غامضة'];
const GOALS=['حماية واحد معين من الفريق','تجميع أكبر قدر من الدوا','اكتشاف سر الجائحة','الوصول لعيلتك','إثبات إنك القائد','الحفاظ على سر عن الفريق'];
const SYS=`إنت راوي لعبة بقاء جماعية في نهاية العالم. اكتب بالعربية البسيطة بلمسة مصرية في الحوار.
كل رد لازم يكون بالشكل ده بالظبط:
1) مشهد قصير 90 إلى 130 كلمة، فيه توتر وتفاصيل وبيستخدم أسماء اللاعبين وحالتهم ومهاراتهم وسماتهم.
2) سطر فيه @@@ بس.
3) JSON واحد بدون أي كلام تاني:
{"choices":["اختيار","اختيار","اختيار"],"fx":{"food":0,"water":0,"meds":0,"fuel":0,"ammo":0,"morale":0,"trust":0},"kills":0,"hurt":{"0":0},"ally":null,"beat":"سطر واحد بيلخص اللي حصل","seed":null,"timer":false,"boss":false,"power":null,"end":null}
القواعد: من 3 إلى 4 اختيارات مختلفة جداً (مكان، مخاطرة، رحمة، تضحية). fx تغييرات صغيرة (من -3 إلى +3) مرتبطة بنتيجة اختيار الفريق السابق. hurt = أضرار على اللاعبين بالرقم (index) من 0 إلى 25. kills = عدد المصابين/الوحوش اللي الفريق قتلهم في المشهد. ally = اسم ناجي جديد انضم أو null. seed = عاقبة مؤجلة تحصل بعد 3 مشاهد أو أكتر (مثلا "الناجي اللي سبناه هيرجع") أو null. استخدم الـseeds القديمة وارجع لها. timer=true في لحظة خطر حرجة. boss=true لو وحش ضخم. power = قوة خارقة عشوائية بثمن لواحد من اللاعبين {"p":index,"text":".."} أو null. الدرجات: النرد من 1 إلى 20 بيحدد نجاح الاختيار السابق (أقل من 8 فشل، أكتر من 14 نجاح كبير) ومهارات اللاعبين بتحسنه. غير الأماكن والأحداث والجوائح، ومتكررش. المشهد رقم 14 فما فوق: ابدأ تمهد لنهاية، وحط end="win" أو "lose" أو "twist" لما القصة توصل نهاية طبيعية (النجاة، ملجأ، كشف سبب الجائحة، أو نهاية مأساوية). مفيش end قبل المشهد 10 إلا لو الكل مات.`;

let S=null, busy=false, tmr=null;
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const DEF={gemini:'gemini-3.5-flash-lite',claude:'claude-haiku-5-5'};
const cfg=()=>{const prov=localStorage.getItem('p')||'gemini';return{key:localStorage.getItem('k')||'',prov,model:localStorage.getItem('m')||DEF[prov]}};
const save=()=>{try{localStorage.setItem('save',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function home(){
  clearInterval(tmr);
  const has=localStorage.getItem('save');
  $('app').innerHTML=`<h1>آخر الدنيا</h1><div class="tape"></div>
  <p class="mut">لعبة قصة جماعية. تليفون واحد، وإنتم بتقرروا مع بعض.</p>
  <button class="pri" onclick="setup()">رحلة جديدة</button>
  ${has?`<button class="ch" onclick="S=JSON.parse(localStorage.getItem('save'));game()">كمّل آخر رحلة</button>`:''}
  <button class="ch" onclick="loadCode()">تحميل بكود حفظ</button>
  <button class="ch" onclick="settings()">الإعدادات (مفتاح API)</button>`;
}
function settings(){
  const c=cfg();
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div>
  <h2>الإعدادات</h2><p class="mut">المفتاح بيتحفظ على جهازك بس.</p>
  <label>مزوّد الذكاء الاصطناعي</label>
  <select id="p" onchange="$('m').value=DEF[this.value]"><option value="gemini" ${c.prov=='gemini'?'selected':''}>Gemini (مجاني)</option><option value="claude" ${c.prov=='claude'?'selected':''}>Claude (مدفوع)</option></select>
  <label>مفتاح API</label><input id="k" type="password" value="${esc(c.key)}" placeholder="الصق المفتاح هنا" dir="ltr">
  <label>الموديل</label><input id="m" value="${esc(c.model)}" dir="ltr">
  <div style="height:10px"></div><button class="pri" onclick="localStorage.setItem('p',$('p').value);localStorage.setItem('k',$('k').value.trim());localStorage.setItem('m',$('m').value.trim()||DEF[$('p').value]);closeM()">حفظ</button></div></div>`;
}
const closeM=()=>$('modal').innerHTML='';

function setup(){
  $('app').innerHTML=`<h2>جهّزوا الفريق</h2><div class="tape"></div>
  <div class="box"><label>عدد اللاعبين</label><select id="n" onchange="drawPl()">${[2,3,4,5,6].map(n=>`<option ${n==3?'selected':''}>${n}</option>`).join('')}</select></div>
  <div id="pl"></div>
  <div class="box"><label>نوع الكارثة</label><select id="sc">${Object.keys(SCEN).map(k=>`<option>${k}</option>`).join('')}</select></div>
  <button class="pri" onclick="begin()">ابدأوا الرحلة</button>`;
  drawPl();
}
function drawPl(){
  const n=+$('n').value;
  $('pl').innerHTML=Array.from({length:n},(_,i)=>`<div class="box row"><input id="pn${i}" placeholder="اسم اللاعب ${i+1}" style="flex:2"><select id="pr${i}">${Object.keys(ROLES).map(r=>`<option>${r}</option>`).join('')}</select></div>`).join('');
}
function begin(){
  if(!cfg().key){settings();return}
  const n=+$('n').value, sc=$('sc').value;
  const traits=['شجاع','حذر','محظوظ','عصبي','هادي','فضولي'];
  S={sc:sc==='عشوائي'?rnd(Object.values(SCEN).filter(Boolean)):SCEN[sc],
    players:Array.from({length:n},(_,i)=>{const r=$('pr'+i).value,sk={};SK.forEach(k=>sk[k]=1);sk[ROLES[r]]+=1;
      return{name:$('pn'+i).value.trim()||'لاعب '+(i+1),role:r,hp:100,sk,pts:0,trait:rnd(traits),goal:rnd(GOALS),power:null}}),
    res:{food:6,water:6,meds:3,fuel:3,ammo:4,morale:7,trust:7},kills:0,level:1,n:0,beats:[],seeds:[],allies:[],log:[],scene:null,over:null,place:rnd(PLACES)};
  next(null);
}

function ctx(choice){
  const d20=1+Math.floor(Math.random()*20);
  return `الكارثة: ${S.sc}
الفريق: ${JSON.stringify(S.players.map((p,i)=>({i,اسم:p.name,دور:p.role,صحة:p.hp,مهارات:p.sk,سمة:p.trait,قوة:p.power,هدف_سري:p.goal})))}
الموارد: ${JSON.stringify(S.res)}
الحلفاء: ${S.allies.join('، ')||'لا أحد'}
مستوى الفريق: ${S.level}، قتلى: ${S.kills}
ملخص الأحداث: ${S.beats.join(' | ')||'البداية'}
عواقب مؤجلة: ${S.seeds.slice(-4).join(' | ')||'لا شيء'}
آخر مشهد: ${S.scene?S.scene.text:'مفيش، ده أول مشهد: ابدأ في '+S.place}
اختيار الفريق: ${choice||'—'}
نرد: ${d20}
عنصر عشوائي: ${rnd(EVENTS)} في ${rnd(PLACES)}
رقم المشهد: ${S.n+1}`;
}

async function stream(system,user,max,onText){
  const c=cfg(),g=c.prov==='gemini';
  const url=g?`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.model)}:streamGenerateContent?alt=sse`:'https://api.anthropic.com/v1/messages';
  const headers=g?{'content-type':'application/json','x-goog-api-key':c.key}:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
  const body=g?{systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{maxOutputTokens:max+1500,temperature:1}}
             :{model:c.model,max_tokens:max,stream:true,system,messages:[{role:'user',content:user}]};
  const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
  if(!r.ok){let t='';try{const e=await r.json();t=e.error.message}catch(e){}
    throw new Error(r.status===429?'خلصت الحصة المجانية دلوقتي، جرّبوا بعد شوية أو بكرة. ':(r.status+' '+t))}
  const rd=r.body.getReader(),dc=new TextDecoder();let buf='',full='';
  for(;;){const{done,value}=await rd.read();if(done)break;
    buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
    for(const l of ls){if(!l.startsWith('data:'))continue;
      try{const j=JSON.parse(l.slice(5));let t='';
        if(g){t=((j.candidates||[])[0]?.content?.parts||[]).filter(x=>!x.thought).map(x=>x.text||'').join('')}
        else if(j.type==='content_block_delta'&&j.delta.text)t=j.delta.text;
        if(t){full+=t;onText(full)}}catch(e){}}}
  return full;
}

async function next(choice){
  if(busy)return;busy=true;clearInterval(tmr);
  const prev=S.scene, prevCh=choice;
  $('app').innerHTML=`<h2>المشهد ${S.n+1}</h2><div class="tape"></div><div class="story" id="st"><span class="mut">الراوي بيجهز المشهد...</span></div>`;
  try{
    const full=await stream(SYS,ctx(choice),900,t=>{const i=t.indexOf('@@@');$('st').textContent=(i<0?t:t.slice(0,i)).trim()});
    const i=full.indexOf('@@@');if(i<0)throw new Error('رد غير مفهوم، جرّب تاني');
    const text=full.slice(0,i).trim();
    const m=full.slice(i+3).match(/\{[\s\S]*\}/);if(!m)throw new Error('رد غير مكتمل، جرّب تاني');
    const j=JSON.parse(m[0]);
    apply(j);
    S.n++;S.scene={text,choices:(j.choices||[]).slice(0,4),timer:!!j.timer,boss:!!j.boss};
    if(prevCh)S.log.push({c:prevCh});
    S.over=j.end||null;
    if(S.players.every(p=>p.hp<=0))S.over='lose';
    save();busy=false;game();
  }catch(e){busy=false;S.scene=prev;
    $('app').innerHTML=`<div class="box err">حصل خطأ: ${esc(e.message)}</div><button class="pri" onclick="next(${prevCh?JSON.stringify(prevCh).replace(/"/g,'&quot;'):'null'})">حاول تاني</button><button class="ch" onclick="home()">الرئيسية</button>`;
  }
}
function apply(j){
  const fx=j.fx||{};for(const k in S.res)S.res[k]=Math.max(0,Math.min(10,S.res[k]+(+fx[k]||0)));
  for(const k in (j.hurt||{})){const p=S.players[+k];if(p)p.hp=Math.max(0,p.hp-(+j.hurt[k]||0))}
  if(S.res.food==0||S.res.water==0)S.players.forEach(p=>p.hp=Math.max(0,p.hp-6));
  S.kills+=+j.kills||0;
  if(j.ally&&!S.allies.includes(j.ally))S.allies.push(j.ally);
  if(j.beat)S.beats.push(j.beat);if(j.seed)S.seeds.push(j.seed);
  if(j.power&&S.players[j.power.p]&&!S.players[j.power.p].power)S.players[j.power.p].power=j.power.text;
  while(S.kills>=S.level*5){S.level++;S.players.forEach(p=>p.pts+=3);S.lvlUp=true}
}

let picked=null;
function game(){
  clearInterval(tmr);picked=null;
  if(!S.scene){home();return}
  const sc=S.scene,pts=S.players.reduce((a,p)=>a+p.pts,0);
  const lv=S.lvlUp?`<div class="box" style="border-color:var(--hz)">⭐ الفريق وصل المستوى ${S.level}! كل لاعب أخد 3 نقاط تطوير.</div>`:'';S.lvlUp=false;
  $('app').innerHTML=`
  <div class="res">${Object.keys(RES).map(k=>`<div class="${S.res[k]<=1?'low':''}">${RES[k].split(' ')[0]}<b>${S.res[k]}</b><span class="mut">${RES[k].split(' ')[1]}</span></div>`).join('')}<div>⚔️<b>${S.kills}</b><span class="mut">قتلى</span></div></div>
  <div class="pl" style="margin-top:8px">${S.players.map(p=>`<div class="${p.hp<=0?'dead':''}"><b>${esc(p.name)}</b> <span class="mut">${p.role}</span><div class="bar"><i style="width:${p.hp}%"></i></div>${p.hp<=0?'مات':''}${p.power?'<br>✨ '+esc(p.power):''}</div>`).join('')}</div>
  <div class="tape" style="margin-top:12px"></div>
  ${lv}${sc.boss?'<div class="mut" style="color:var(--red)">⚠️ زعيم المرحلة</div>':''}
  <h3>المشهد ${S.n}</h3><div class="story">${esc(sc.text)}</div>
  ${S.over?endBox():`${sc.timer?'<div class="mut">قرروا بسرعة!</div><div class="tm" id="tm" style="width:100%"></div>':''}
  <div id="chs">${sc.choices.map((c,i)=>`<button class="ch" onclick="pick(${i})">${esc(c)}</button>`).join('')}</div><div id="cf"></div>`}
  <div class="bottom"><button onclick="upg()">🔧 تطوير${pts?' ('+pts+')':''}</button><button onclick="team()">👥 الفريق</button><button onclick="code()">💾 كود</button><button onclick="finish()">📖 نهاية</button></div>`;
  if(sc.timer&&!S.over){let t=12;tmr=setInterval(()=>{t--;const b=$('tm');if(b)b.style.width=(t/12*100)+'%';if(t<=0){clearInterval(tmr);confirmPick(Math.floor(Math.random()*sc.choices.length))}},1000)}
}
function endBox(){return `<div class="box" style="border-color:var(--hz)"><b>${{win:'نجوتوا! 🎉',lose:'الرحلة انتهت بمأساة 💀',twist:'نهاية مفاجئة...'}[S.over]||'النهاية'}</b><p class="mut">دلوقتي الراوي هيكتب رحلتكم كلها كرواية قصيرة.</p><button class="pri" onclick="novel()">اكتب الرواية</button></div>`}
function pick(i){
  picked=i;document.querySelectorAll('.ch').forEach((b,k)=>b.classList.toggle('sel',k==i));
  $('cf').innerHTML=`<div class="box"><b>كل اللاعبين موافقين على الاختيار ده؟</b><div class="row" style="margin-top:8px"><button class="pri" onclick="confirmPick(${i})">كلنا موافقين ✓</button><button onclick="$('cf').innerHTML='';document.querySelectorAll('.ch').forEach(b=>b.classList.remove('sel'))">لسه بنتناقش</button></div></div>`;
}
function confirmPick(i){clearInterval(tmr);next(S.scene.choices[i])}

function team(){
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>الفريق</h2>
  ${S.players.map((p,i)=>`<div class="box"><b>${esc(p.name)}</b> (${p.role}، ${p.trait}) صحة ${p.hp}<br><span class="mut">${SK.map(k=>k+' '+p.sk[k]).join(' · ')}</span>${p.power?'<br>✨ '+esc(p.power):''}<br><button style="margin-top:6px" onclick="goal(${i})">هدفي السري (صاحبه بس يبص)</button><div id="g${i}" class="mut"></div></div>`).join('')}
  ${S.allies.length?`<p>الحلفاء: ${S.allies.map(esc).join('، ')}</p>`:''}
  <p class="mut">المستوى ${S.level}، قتلى ${S.kills}. المستوى الجاي عند ${S.level*5} قتيل.</p></div></div>`;
}
function goal(i){const e=$('g'+i);e.textContent=e.textContent?'':S.players[i].goal}
function upg(){
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>نقاط التطوير</h2>
  ${S.players.map((p,i)=>`<div class="box"><b>${esc(p.name)}</b> <span class="mut">نقاط: ${p.pts}</span>${SK.map(k=>`<div class="sk"><span>${k} (${p.sk[k]})</span><button ${p.pts?'':'disabled'} onclick="up(${i},'${k}')">+</button></div>`).join('')}</div>`).join('')}</div></div>`;
}
function up(i,k){const p=S.players[i];if(p.pts>0){p.pts--;p.sk[k]++;save();upg();if(S.players.every(x=>!x.pts))game()}}

function code(){
  const c=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>كود الحفظ</h2><p class="mut">الرحلة بتتحفظ تلقائي. انسخوا الكود ده لو عايزين تكملوا من جهاز تاني.</p><textarea id="cd" rows="5" dir="ltr" readonly>${c}</textarea><div class="row" style="margin-top:8px"><button class="pri" onclick="$('cd').select();navigator.clipboard&&navigator.clipboard.writeText($('cd').value);this.textContent='اتنسخ ✓'">نسخ</button><button onclick="closeM();home()">خروج للرئيسية</button></div></div></div>`;
}
function loadCode(){
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>تحميل رحلة</h2><textarea id="cd" rows="5" dir="ltr" placeholder="الصقوا الكود هنا"></textarea><div style="height:8px"></div><button class="pri" onclick="try{S=JSON.parse(decodeURIComponent(escape(atob($('cd').value.trim()))));save();closeM();game()}catch(e){this.textContent='الكود غلط'}">تحميل</button></div></div>`;
}
function finish(){
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>إنهاء الرحلة؟</h2><p>الراوي هيحوّل اللي حصل لحد دلوقتي لرواية قصيرة تقدروا تشاركوها.</p><button class="pri" onclick="closeM();novel()">اكتب الرواية</button><button class="ch" onclick="closeM()">لسه، نكمل</button></div></div>`;
}

async function novel(){
  if(busy)return;busy=true;
  const dead=S.players.filter(p=>p.hp<=0).map(p=>p.name);
  const stats=`قتلى: ${S.kills}، مستوى: ${S.level}، مشاهد: ${S.n}، الحلفاء: ${S.allies.join('، ')||'لا أحد'}، الموتى: ${dead.join('، ')||'لا أحد'}، النهاية: ${S.over||'الفريق قرر ينهي الرحلة هنا'}`;
  const u=`الكارثة: ${S.sc}\nالأبطال: ${S.players.map(p=>`${p.name} (${p.role}، ${p.trait}، هدف سري: ${p.goal}${p.power?'، قوة: '+p.power:''})`).join(' / ')}\nالأحداث بالترتيب: ${S.beats.map((b,i)=>`${i+1}) ${b}${S.log[i]?' ← اختاروا: '+S.log[i].c:''}`).join('\n')}\nعواقب: ${S.seeds.join(' | ')}\nآخر مشهد: ${S.scene?S.scene.text:''}\nإحصائيات: ${stats}`;
  const sys='إنت روائي. حوّل أحداث رحلة النجاة دي لرواية قصيرة بالعربية الفصحى المبسطة، حوالي 900 إلى 1300 كلمة، مقسمة لـ 3 إلى 5 فصول بعناوين، وليها عنوان رئيسي. استخدم أسماء الأبطال وقراراتهم الحقيقية وعواقبها، واكتب حوارات ووصف، وخلّي النهاية متسقة مع إحصائيات الرحلة. متضيفش أحداث كبيرة من عندك. اكتب النص بس.';
  $('app').innerHTML=`<h2>الرواية</h2><div class="tape"></div><div class="novel" id="nv"><span class="mut">الراوي بيكتب رحلتكم...</span></div>`;
  try{
    const t=await stream(sys,u,3000,t=>$('nv').textContent=t);
    busy=false;S.novel=t;save();
    $('app').innerHTML=`<div class="novel">${esc(t)}</div><div class="tape" style="margin-top:20px"></div>
    <div class="box mut">${esc(stats)}</div>
    <button class="pri" onclick="shareN()">مشاركة الرواية</button>
    <button class="ch" onclick="home()">الرئيسية</button>`;
  }catch(e){busy=false;$('app').innerHTML=`<div class="box err">حصل خطأ: ${esc(e.message)}</div><button class="pri" onclick="novel()">حاول تاني</button><button class="ch" onclick="game()">رجوع</button>`}
}
function shareN(){
  const t=S.novel;
  if(navigator.share)navigator.share({title:'رحلتنا في آخر الدنيا',text:t}).catch(()=>{});
  else navigator.clipboard.writeText(t).then(()=>alert('اتنسخت الرواية'));
}
home();
if(!cfg().key)setTimeout(settings,300);
</script>
</body>
</html>
